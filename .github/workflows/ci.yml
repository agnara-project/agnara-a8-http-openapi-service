name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        
    - name: Check Formatting
      run: ruff format --check .
        
    - name: Lint
      run: ruff check .
        
    - name: Test
      run: pytest -v -m "not docker"
        
    - name: Validate Build
      run: |
        python -m build
        python -m pip check

  docker-smoke:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          
      - name: Install test dependencies
        run: pip install -e .[dev]
        
      - name: Validate Compose Config
        run: docker compose config
        
      - name: Start Docker Stack
        run: docker compose up -d --build
        
      - name: Wait for API health
        run: |
          for i in {1..30}; do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' $(docker compose ps -q agnara-api))" == "healthy" ]; then
              echo "API is healthy."
              exit 0
            fi
            echo "Waiting for API health..."
            sleep 2
          done
          echo "API failed to become healthy."
          docker compose ps
          docker compose logs
          exit 1
          
      - name: Verify Swagger UI and OpenAPI schema
        run: |
          curl --fail http://localhost:8000/openapi.json
          curl --fail --retry 10 --retry-all-errors --retry-delay 2 http://localhost:8080/
          curl --fail http://localhost:8080/openapi.json
          curl --fail http://localhost:8080/openapi.json | python -c "import json,sys; d=json.load(sys.stdin); assert d['openapi']=='3.2.0'"
          
      - name: Install Playwright Browsers
        run: python -m playwright install --with-deps chromium
        
      - name: Run Swagger UI Integration Test
        run: pytest -v -m docker
        
      - name: Capture logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs
        
      - name: Tear down stack
        if: always()
        run: docker compose down --remove-orphans
