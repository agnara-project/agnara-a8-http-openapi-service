name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        
    - name: Check Formatting
      run: ruff format --check .
        
    - name: Lint
      run: ruff check .
        
    - name: Test
      run: pytest -v
        
    - name: Validate Build
      run: |
        python -m build
        python -m pip check
