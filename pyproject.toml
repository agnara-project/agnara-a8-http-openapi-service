[project]
name = "agnara-a8-http-openapi-service"
version = "1.0.0"
description = "A validation project for Agnara 0.1.0a8 HTTP capabilities."
requires-python = ">=3.14"

dependencies = [
    "agnara==0.1.0a8",
    "agnara-http==0.1.0a8",
    "uvicorn",
    "pydantic"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx"
]
