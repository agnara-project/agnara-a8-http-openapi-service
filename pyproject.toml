[project]
name = "agnara-a8-http-openapi-service"
version = "1.0.1"
description = "A validation project for Agnara 0.1.0a8 HTTP capabilities."
requires-python = ">=3.14"

dependencies = [
    "agnara==0.1.0a8",
    "agnara-http==0.1.0a8",
    "uvicorn"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "build",
    "playwright",
    "pytest-playwright"
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "docker: tests requiring the Docker Compose integration environment"
]
